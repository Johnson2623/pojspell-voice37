<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suno 音樂指令模板</title>
<style>
:root{--bg:#141414;--pan:#1b1b1b;--card:#222;--bd:#333;--tx:#f2f2f2;--mu:#8a8a8a;--ac:#ff7a45;--acbg:#3a2a22;--in:#161616;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f1ee;--pan:#fff;--card:#f1ece8;--bd:#ddd5ce;--tx:#222;--mu:#777;--acbg:#ffe8dc;--in:#faf7f5}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:6px 5px 30px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{padding:15px 6px;border:1px solid var(--bd);border-radius:10px;background:var(--pan);color:var(--tx);font:600 16px inherit;font-family:inherit;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{height:9px;background:var(--card);border-radius:9px;margin:26px 0 20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.main{display:grid;grid-template-columns:262px 1fr;gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:7px}
.si{padding:14px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);text-align:left;font:500 16px inherit;font-family:inherit;cursor:pointer}
.si.on{border-color:var(--ac);background:var(--acbg)}
.pan{background:var(--pan);border:1px solid var(--bd);border-radius:14px;padding:20px 20px 24px;min-width:0}
h2{margin:0 0 4px;font-size:21px}.sub{color:var(--mu);margin:0 0 16px;font-size:14px}
.lb{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}.hint{color:var(--mu);font-weight:400;font-size:12px;margin-left:6px}
input,textarea,select{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:13px 14px;font:15px inherit;font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--mu)}textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)}
details{border:1px solid var(--bd);border-radius:12px;background:var(--in);margin-bottom:8px}
summary{padding:11px 14px;cursor:pointer;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}details .chips{padding:2px 14px 14px}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:14px inherit;font-family:inherit;cursor:pointer}
.chip small{color:var(--mu);margin-left:4px;font-size:12px}
.chip.on{border-color:var(--ac);background:var(--acbg)}
.chip[data-ic]{color:#a8e6b0}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .chip[data-ic]{color:#3f9a52}}
:root[data-theme="light"] .chip[data-ic]{color:#3f9a52}
.nav{display:flex;gap:10px;margin-top:24px}.btn{padding:11px 20px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.sp{flex:1}
.ob{border:1px solid var(--bd);border-radius:12px;background:var(--in);margin-bottom:14px;overflow:hidden}
.oh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--bd);font-weight:700;font-size:14px}
.oh span{color:var(--mu);font-weight:400;font-size:12px;margin:0 auto 0 10px}.oh .bad{color:#ff5a5a}
.ob textarea{border:0;border-radius:0;min-height:70px;background:transparent}
.btn.s{padding:5px 12px;font-size:13px}
.flash{border-color:var(--ac)!important;box-shadow:0 0 0 3px var(--acbg)}
.dis{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.btn.s.on{border-color:var(--ac);background:var(--acbg)}
@media(max-width:760px){.main{grid-template-columns:132px 1fr;gap:10px}.si{padding:11px 10px;font-size:14px}.tab{font-size:13px;padding:13px 2px}.pan{padding:16px 14px}}
@media(max-width:480px){.main{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding-bottom:4px}.si{white-space:nowrap;padding:11px 14px}}
</style></head><body>
<div class="tabs" id="tabs"></div><div class="bar"><i id="pg"></i></div>
